services:
  mongodb:
    image: mongo:latest
    container_name: patient-forms-mongo
    ports:
      - '27017:27017'
    volumes:
      - team_a_mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin

volumes:
  team_a_mongo-data:
    driver: local
